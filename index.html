<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DA FARE</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:#f4f5f7;
  color:#171717;
}

.container{
  width:min(900px,92%);
  margin:0 auto;
  padding:32px 0 60px;
}

header{
  margin-bottom:24px;
}

.logo{
  font-size:14px;
  font-weight:800;
  letter-spacing:2px;
  color:#555;
}

h1{
  font-size:42px;
  line-height:1;
  margin:10px 0;
}

.subtitle{
  color:#666;
  font-size:17px;
}

.card{
  background:white;
  border-radius:20px;
  padding:22px;
  margin-top:18px;
  box-shadow:0 8px 30px rgba(0,0,0,.06);
}

textarea{
  width:100%;
  min-height:190px;
  resize:vertical;
  border:1px solid #ddd;
  border-radius:14px;
  padding:16px;
  font-size:16px;
  line-height:1.5;
  outline:none;
}

textarea:focus{
  border-color:#111;
}

.buttons{
  display:flex;
  gap:10px;
  margin-top:12px;
}

button{
  border:0;
  border-radius:12px;
  padding:13px 18px;
  font-size:15px;
  font-weight:700;
  cursor:pointer;
}

.primary{
  background:#111;
  color:white;
  flex:1;
}

.secondary{
  background:#eee;
  color:#222;
}

.result{
  display:none;
}

.label{
  font-size:12px;
  font-weight:800;
  letter-spacing:1px;
  color:#777;
  margin-bottom:8px;
}

.category{
  font-size:25px;
  font-weight:800;
}

.priority{
  display:inline-block;
  margin-top:8px;
  padding:7px 11px;
  border-radius:20px;
  background:#eee;
  font-weight:800;
  font-size:13px;
}

.summary{
  margin-top:10px;
  color:#555;
  line-height:1.5;
}

.now{
  border-left:5px solid #111;
  background:#f5f5f5;
  padding:18px;
  border-radius:12px;
  font-size:20px;
  font-weight:800;
}

.section{
  margin-top:25px;
}

.section h2{
  font-size:19px;
  margin:0 0 12px;
}

ul,ol{
  margin:0;
  padding-left:22px;
}

li{
  margin:10px 0;
  line-height:1.45;
}

.meta{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
}

.metaBox{
  background:#f7f7f7;
  border-radius:12px;
  padding:14px;
}

.metaTitle{
  font-size:12px;
  color:#777;
  font-weight:800;
  margin-bottom:5px;
}

.metaValue{
  font-weight:700;
}

.warning{
  color:#555;
  line-height:1.5;
}

.empty{
  color:#888;
}

@media(max-width:600px){
  .container{
    padding-top:22px;
  }

  h1{
    font-size:34px;
  }

  .meta{
    grid-template-columns:1fr;
  }

  .buttons{
    flex-direction:column;
  }
}
</style>
</head>

<body>

<div class="container">

<header>
  <div class="logo">DA FARE</div>
  <h1>Dal caos all'azione.</h1>
  <div class="subtitle">
    Scrivi un problema, un messaggio o una situazione. DA FARE trova cosa conta e cosa fare adesso.
  </div>
</header>

<div class="card">

<textarea id="input" placeholder="Esempio:
Devo andare a Roma venerdì per un appuntamento alle 15:30. Non ho ancora comprato il biglietto del treno e devo ricordarmi di portare il documento."></textarea>

<div class="buttons">
  <button class="primary" onclick="analyze()">Trasforma in azioni</button>
  <button class="secondary" onclick="clearAll()">Pulisci</button>
</div>

</div>

<div id="result" class="result">

<div class="card">

<div class="label">ANALISI</div>
<div id="category" class="category"></div>
<div id="summary" class="summary"></div>

<div class="section">
<div class="label">PRIORITÀ</div>
<div id="priority" class="priority"></div>
</div>

<div class="section">
<div class="label">👉 FAI QUESTO ADESSO</div>
<div id="firstAction" class="now"></div>
</div>

<div class="section">
<h2>📋 Sequenza</h2>
<ol id="steps"></ol>
</div>

<div class="section">
<h2>📌 Elementi rilevati</h2>
<div class="meta">

<div class="metaBox">
<div class="metaTitle">DATE / ORARI</div>
<div id="dates" class="metaValue"></div>
</div>

<div class="metaBox">
<div class="metaTitle">IMPORTI</div>
<div id="money" class="metaValue"></div>
</div>

<div class="metaBox">
<div class="metaTitle">COSE DA FARE</div>
<div id="tasks" class="metaValue"></div>
</div>

<div class="metaBox">
<div class="metaTitle">DA PORTARE / RICORDARE</div>
<div id="remember" class="metaValue"></div>
</div>

</div>
</div>

<div class="section">
<h2>⚠️ Cosa controllare</h2>
<ul id="warnings"></ul>
</div>

</div>
</div>

</div>

<script>

function normalize(text){
  return text
    .replace(/\s+/g," ")
    .trim();
}

function escapeHTML(text){
  return String(text)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function unique(arr){
  return [...new Set(arr.filter(Boolean))];
}

function extractMoney(text){
  const matches = text.match(
    /(?:€\s*)?\d+(?:[.,]\d{1,2})?\s*(?:€|euro)/gi
  ) || [];

  return unique(matches);
}

function extractTimes(text){
  const matches = text.match(
    /\b(?:[01]?\d|2[0-3])[:.][0-5]\d\b/g
  ) || [];

  return unique(matches);
}

function extractDates(text){

  const results=[];

  const numeric =
    text.match(
      /\b(?:entro\s+)?(?:[0-3]?\d)[\/\-](?:0?\d|1[0-2])(?:[\/\-]\d{2,4})?\b/gi
    ) || [];

  results.push(...numeric);

  const months =
    "gennaio|febbraio|marzo|aprile|maggio|giugno|luglio|agosto|settembre|ottobre|novembre|dicembre";

  const monthMatches =
    text.match(
      new RegExp(
        "\\b(?:entro\\s+)?\\d{1,2}\\s+(?:"+months+")\\b",
        "gi"
      )
    ) || [];

  results.push(...monthMatches);

  const weekdays =
    text.match(
      /\b(?:oggi|domani|dopodomani|lunedì|lunedi|martedì|martedi|mercoledì|mercoledi|giovedì|giovedi|venerdì|venerdi|sabato|domenica)\b/gi
    ) || [];

  results.push(...weekdays);

  const relative =
    text.match(
      /\b(?:entro\s+)?(?:questa|questo)\s+(?:settimana|mese|sera|mattina)\b/gi
    ) || [];

  results.push(...relative);

  return unique(results);
}

function detectCategory(text){

  if(/bollett|pagament|fattur|scadenza|bonifico|addebito|pagare/i.test(text))
    return "Bolletta / pagamento";

  if(/appuntament|prenotaz|visita|incontro|biglietto|treno|aereo|hotel/i.test(text))
    return "Prenotazione / appuntamento";

  if(/ordine|acquist|spedizion|consegna|amazon|pacco/i.test(text))
    return "Acquisto / ordine";

  if(/lavoro|turno|capo|collega|azienda|ufficio|magazzino/i.test(text))
    return "Lavoro";

  if(/document|modulo|pratica|firma|comune|inps|isee|contratto/i.test(text))
    return "Documento / pratica";

  if(/casa|pulire|ripar|lavatrice|caldaia|spesa/i.test(text))
    return "Casa";

  return "Problema / attività";
}

function detectPriority(text, dates){

  if(
    /urgente|subito|oggi|scade oggi|scade domani|entro oggi|entro domani|non posso|importante|ultimo giorno/i.test(text)
  )
    return "ALTA";

  if(
    dates.length>0 ||
    /devo|bisogna|necessario|ricord|entro|domani|venerdì|sabato|domenica/i.test(text)
  )
    return "MEDIA";

  return "BASSA";
}

function extractTasks(text){

  const tasks=[];

  if(/non ho ancora comprato|devo comprare|devo acquistare|comprare|acquistare/i.test(text))
    tasks.push("Completare l'acquisto indicato.");

  if(/devo pagare|devo effettuare il pagamento|pagare/i.test(text))
    tasks.push("Effettuare il pagamento.");

  if(/devo andare|devo recarmi|andare a|recarmi a/i.test(text))
    tasks.push("Organizzare lo spostamento necessario.");

  if(/devo chiamare|chiamare|telefonare/i.test(text))
    tasks.push("Effettuare la chiamata necessaria.");

  if(/devo inviare|inviare|mandare/i.test(text))
    tasks.push("Inviare quanto richiesto.");

  if(/devo firmare|firmare/i.test(text))
    tasks.push("Firmare il documento richiesto.");

  if(/devo controllare|controllare|verificare/i.test(text))
    tasks.push("Controllare le informazioni indicate.");

  return unique(tasks);
}

function extractRemember(text){

  const items=[];

  if(/documento|documenti|carta d'identità|carta di identità|passaporto/i.test(text))
    items.push("Portare il documento necessario.");

  if(/biglietto/i.test(text))
    items.push("Avere con sé il biglietto.");

  if(/ricevuta|conferma|email|mail/i.test(text))
    items.push("Conservare la conferma o ricevuta.");

  if(/chiavi/i.test(text))
    items.push("Ricordarsi delle chiavi.");

  return unique(items);
}

function buildSteps(category,text,dates,money,tasks,remember){

  const steps=[];

  if(tasks.length)
    steps.push(...tasks);

  if(dates.length)
    steps.push("Controllare data e ora indicate: " + dates.join(", ") + ".");

  if(money.length)
    steps.push("Verificare l'importo: " + money.join(", ") + ".");

  if(remember.length)
    steps.push(...remember);

  if(category==="Bolletta / pagamento"){
    steps.push("Controllare che non ci siano pagamenti precedenti ancora da verificare.");
    steps.push("Conservare la ricevuta dopo il pagamento.");
  }

  if(category==="Prenotazione / appuntamento"){
    steps.push("Controllare luogo, data e ora dell'appuntamento.");
    steps.push("Conservare la conferma della prenotazione.");
  }

  if(category==="Acquisto / ordine"){
    steps.push("Controllare disponibilità, prezzo e consegna.");
    steps.push("Conservare la conferma dell'ordine.");
  }

  if(!steps.length)
    steps.push("Individuare la prima azione concreta necessaria.");

  return unique(steps).slice(0,6);
}

function buildFirstAction(category,text,tasks,dates,remember){

  if(tasks.length)
    return tasks[0];

  if(remember.length)
    return remember[0];

  if(dates.length)
    return "Controlla subito la data o l'orario indicato: " + dates[0] + ".";

  if(category==="Bolletta / pagamento")
    return "Controlla subito stato, importo e scadenza del pagamento.";

  if(category==="Prenotazione / appuntamento")
    return "Controlla subito data, ora e luogo dell'appuntamento.";

  return "Individua la prima azione concreta da completare.";
}

function buildWarnings(category,dates,money,tasks,remember){

  const warnings=[];

  if(!dates.length)
    warnings.push("Nessuna data o scadenza rilevata.");

  if(!money.length && category==="Bolletta / pagamento")
    warnings.push("Nessun importo rilevato: controllalo sul documento originale.");

  if(!tasks.length)
    warnings.push("Non è stata rilevata un'azione esplicita: verifica cosa devi fare realmente.");

  if(!remember.length && /document|portare|ricord/i.test(
    document.getElementById("input").value
  ))
    warnings.push("Potrebbe esserci qualcosa da ricordare o portare.");

  warnings.push("Verifica sempre le informazioni direttamente sul documento o sulla comunicazione originale.");

  return warnings;
}

function analyze(){

  const raw=document.getElementById("input").value;
  const text=normalize(raw);

  if(!text){
    alert("Scrivi prima una situazione da analizzare.");
    return;
  }

  const category=detectCategory(text);
  const money=extractMoney(text);
  const dates=extractDates(text);
  const times=extractTimes(text);
  const tasks=extractTasks(text);
  const remember=extractRemember(text);
  const priority=detectPriority(text,dates);
  const steps=buildSteps(category,text,dates,money,tasks,remember);

  const allDates=unique([
    ...dates,
    ...times.map(t=>"ore "+t)
  ]);

  const firstAction=buildFirstAction(
    category,
    text,
    tasks,
    allDates,
    remember
  );

  document.getElementById("category").textContent=category;

  document.getElementById("summary").textContent=
    text.length>180 ? text.slice(0,180)+"…" : text;

  document.getElementById("priority").textContent=priority;

  document.getElementById("firstAction").textContent=firstAction;

  document.getElementById("steps").innerHTML=
    steps.map(step=>`<li>${escapeHTML(step)}</li>`).join("");

  document.getElementById("dates").innerHTML=
    allDates.length
      ? allDates.map(x=>escapeHTML(x)).join("<br>")
      : '<span class="empty">Nessuna rilevata</span>';

  document.getElementById("money").innerHTML=
    money.length
      ? money.map(x=>escapeHTML(x)).join("<br>")
      : '<span class="empty">Nessuno rilevato</span>';

  document.getElementById("tasks").innerHTML=
    tasks.length
      ? tasks.map(x=>escapeHTML(x)).join("<br>")
      : '<span class="empty">Nessuna rilevata</span>';

  document.getElementById("remember").innerHTML=
    remember.length
      ? remember.map(x=>escapeHTML(x)).join("<br>")
      : '<span class="empty">Niente rilevato</span>';

  const warnings=buildWarnings(
    category,
    allDates,
    money,
    tasks,
    remember
  );

  document.getElementById("warnings").innerHTML=
    warnings.map(x=>`<li>${escapeHTML(x)}</li>`).join("");

  document.getElementById("result").style.display="block";

  window.scrollTo({
    top:document.getElementById("result").offsetTop-20,
    behavior:"smooth"
  });
}

function clearAll(){

  document.getElementById("input").value="";
  document.getElementById("result").style.display="none";

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });
}

</script>

</body>
</html>
