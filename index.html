<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DA FARE</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#f5f5f7;
  color:#171717;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif
}

.container{
  width:min(920px,calc(100% - 28px));
  margin:auto;
  padding:45px 0 70px
}

.logo{
  font-size:38px;
  font-weight:800;
  letter-spacing:-1.5px
}

.subtitle{
  color:#666;
  margin:7px 0 25px;
  font-size:17px
}

textarea{
  width:100%;
  min-height:190px;
  padding:20px;
  border:1px solid #d7d7d7;
  border-radius:18px;
  background:white;
  font:inherit;
  font-size:17px;
  line-height:1.5;
  resize:vertical;
  outline:none
}

textarea:focus{border-color:#999}

.buttons{
  display:flex;
  gap:10px;
  margin-top:13px
}

button{
  border:0;
  border-radius:12px;
  padding:13px 19px;
  font-weight:700;
  font-size:15px;
  cursor:pointer
}

.primary{background:#171717;color:white}
.secondary{background:#e7e7e7;color:#222}

#output{margin-top:25px}

.card{
  background:white;
  border:1px solid #e5e5e5;
  border-radius:18px;
  padding:21px;
  margin-bottom:13px
}

.card h2{
  margin:0 0 12px;
  font-size:16px
}

.big-action{
  font-size:23px;
  font-weight:800;
  letter-spacing:-.3px
}

.tag{
  display:inline-block;
  background:#eee;
  border-radius:999px;
  padding:6px 10px;
  margin:0 5px 5px 0;
  font-size:13px;
  font-weight:700
}

p{
  line-height:1.5;
  margin:9px 0
}

ol,ul{
  margin:8px 0 0;
  padding-left:23px
}

li{
  margin:8px 0;
  line-height:1.45
}

.empty{color:#777}

@media(max-width:600px){
  .container{padding-top:28px}
  .logo{font-size:32px}
  .buttons{flex-direction:column}
  button{width:100%}
}
</style>
</head>

<body>

<div class="container">

<div class="logo">DA FARE</div>

<div class="subtitle">
Dal caos all'azione.
</div>

<textarea id="input" placeholder="Scrivi quello che devi fare...

Esempio:
Devo consegnare il modulo al Comune venerdì mattina.
Il modulo è già compilato ma devo ancora firmarlo e portarlo con me."></textarea>

<div class="buttons">
<button class="primary" onclick="analyze()">Trasforma in azioni</button>
<button class="secondary" onclick="clearAll()">Cancella</button>
</div>

<div id="output"></div>

</div>

<script>

/* =========================================================
   UTILITÀ
========================================================= */

function normalize(text){
  return text
    .replace(/[“”«»]/g,'"')
    .replace(/[‘’]/g,"'")
    .replace(/\s+/g," ")
    .trim();
}

function esc(text){
  return String(text)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function unique(arr){
  return [...new Set(arr.filter(Boolean))];
}

function has(text, regex){
  return regex.test(text);
}


/* =========================================================
   OGGETTO PRINCIPALE
========================================================= */

function detectObject(text){

  const objects = [
    ["modulo",/\bmodul[oi]\b/i],
    ["documento",/\bdocument[oi]\b/i],
    ["biglietto",/\bbigliett[oi]\b/i],
    ["fattura",/\bfattur[ae]\b/i],
    ["bolletta",/\bbollett[ae]\b/i],
    ["contratto",/\bcontratt[oi]\b/i],
    ["ordine",/\bordine\b/i],
    ["pratica",/\bpratic[ae]\b/i],
    ["email",/\bemail\b|\bmail\b/i],
    ["appuntamento",/\bappuntamento\b|\bvisita\b|\bincontro\b/i]
  ];

  for(const item of objects){
    if(item[1].test(text)) return item[0];
  }

  return "";
}


/* =========================================================
   CATEGORIA
========================================================= */

function detectCategory(text){

  if(
    /\bpagare\b|\bpagamento\b|\bpagato\b|\bbolletta\b|\bfattura\b|\beuro\b|\b€\b/i.test(text)
  ){
    return "Bolletta / pagamento";
  }

  if(
    /\bappuntamento\b|\bvisita\b|\bincontro\b/i.test(text)
  ){
    return "Appuntamento";
  }

  if(
    /\bmodulo\b|\bdocumento\b|\bcomune\b|\bfirma\b|\bfirmare\b|\bfirmarlo\b|\bpratica\b|\bconsegnare\b|\bpresentare\b/i.test(text)
  ){
    return "Documento / pratica";
  }

  if(
    /\bbiglietto\b|\bprenotare\b|\bprenotazione\b|\bcomprare\b|\bacquistare\b|\bordine\b/i.test(text)
  ){
    return "Acquisto / ordine";
  }

  if(
    /\blavoro\b|\bcapo\b|\bcollega\b|\bcliente\b|\bturno\b/i.test(text)
  ){
    return "Lavoro";
  }

  if(
    /\bcasa\b|\bpulire\b|\briordinare\b|\bspesa\b/i.test(text)
  ){
    return "Casa";
  }

  return "Attività";
}


/* =========================================================
   DATA E ORA
========================================================= */

function extractDateTime(text){

  const result=[];

  const weekday =
    /\b(lunedì|lunedi|martedì|martedi|mercoledì|mercoledi|giovedì|giovedi|venerdì|venerdi|sabato|domenica)(?:\s+(mattina|pomeriggio|sera|notte))?\b/gi;

  let m;

  while((m=weekday.exec(text))!==null){
    result.push(
      m[2] ? `${m[1]} ${m[2]}` : m[1]
    );
  }

  const relative =
    /\b(oggi|domani|dopodomani)(?:\s+(mattina|pomeriggio|sera|notte))?\b/gi;

  while((m=relative.exec(text))!==null){
    result.push(
      m[2] ? `${m[1]} ${m[2]}` : m[1]
    );
  }

  const numeric =
    /\b\d{1,2}[\/.-]\d{1,2}(?:[\/.-]\d{2,4})?\b/g;

  result.push(...(text.match(numeric)||[]));

  const month =
    /\b\d{1,2}\s+(gennaio|febbraio|marzo|aprile|maggio|giugno|luglio|agosto|settembre|ottobre|novembre|dicembre)\b/gi;

  result.push(...(text.match(month)||[]));

  const time =
    /\b(?:alle|ore)\s+([01]?\d|2[0-3])(?::([0-5]\d))?\b/gi;

  while((m=time.exec(text))!==null){
    result.push(
      m[2]
      ? `ore ${m[1]}:${m[2]}`
      : `ore ${m[1]}:00`
    );
  }

  if(/\bentro\s+oggi\b/i.test(text)){
    result.push("entro oggi");
  }

  if(/\bentro\s+domani\b/i.test(text)){
    result.push("entro domani");
  }

  /*
    Se "entro domani" è presente,
    non aggiungiamo anche "domani":
    evita duplicati.
  */

  if(result.includes("entro domani")){
    const index=result.indexOf("domani");
    if(index!==-1) result.splice(index,1);
  }

  if(result.includes("entro oggi")){
    const index=result.indexOf("oggi");
    if(index!==-1) result.splice(index,1);
  }

  return unique(result);
}


/* =========================================================
   IMPORTI
========================================================= */

function extractMoney(text){

  return unique(
    text.match(
      /\b\d+(?:[.,]\d{1,2})?\s*(?:€|euro)\b/gi
    )||[]
  );
}


/* =========================================================
   LUOGO
========================================================= */

function extractPlace(text){

  const places=[];

  if(/\bal\s+Comune\b/i.test(text) ||
     /\bnel\s+Comune\b/i.test(text)){
    places.push("Comune");
  }

  const cities =
    text.match(
      /\b(Roma|Milano|Torino|Napoli|Bologna|Firenze|Venezia)\b/gi
    )||[];

  places.push(...cities);

  const presso =
    text.match(/\bpresso\s+(?:il|la)?\s*([^,.]+)/i);

  if(presso && presso[1]){
    places.push(presso[1].trim());
  }

  return unique(places);
}


/* =========================================================
   FRASI DI STATO
========================================================= */

function extractDone(text){

  const done=[];

  /*
    MODULO / DOCUMENTO COMPILATO
  */

  if(
    /\b(?:il|la)\s+(?:modulo|documento)\s+è\s+già\s+compilat[oa]\b/i.test(text) ||
    /\b(?:modulo|documento)\s+è\s+già\s+compilat[oa]\b/i.test(text)
  ){
    done.push("Il modulo/documento è già compilato.");
  }

  /*
    PAGAMENTO GIÀ FATTO
  */

  if(
    /\bho\s+già\s+pagato\b/i.test(text) ||
    /\bl'ho\s+già\s+pagato\b/i.test(text)
  ){
    done.push("Il pagamento è già stato effettuato.");
  }

  /*
    INVIO GIÀ FATTO
  */

  if(
    /\bho\s+già\s+inviato\b/i.test(text) ||
    /\bl'ho\s+già\s+inviato\b/i.test(text)
  ){
    done.push("Il documento è già stato inviato.");
  }

  /*
    ACQUISTO GIÀ FATTO
  */

  if(
    /\bho\s+già\s+comprato\b/i.test(text) ||
    /\bl'ho\s+già\s+comprato\b/i.test(text)
  ){
    done.push("L'acquisto è già stato effettuato.");
  }

  return unique(done);
}


/* =========================================================
   AZIONI MANCANTI
========================================================= */

function extractMissing(text, object){

  const missing=[];

  /*
    FIRMA
  */

  if(
    /\bdevo\s+ancora\s+firmare\b/i.test(text) ||
    /\bdevo\s+ancora\s+firmarlo\b/i.test(text) ||
    /\bdevo\s+ancora\s+firmarla\b/i.test(text) ||
    /\bmi\s+manca\s+la\s+firma\b/i.test(text)
  ){
    missing.push(
      object==="modulo"
      ? "Firmare il modulo."
      : "Firmare il documento."
    );
  }

  /*
    PAGAMENTO
  */

  if(
    /\bdevo\s+ancora\s+pagare\b/i.test(text) ||
    /\bnon\s+ho\s+ancora\s+pagato\b/i.test(text) ||
    /\bnon\s+l'ho\s+ancora\s+pagato\b/i.test(text) ||
    /\bnon\s+ho\s+ancora\s+effettuato\s+il\s+pagamento\b/i.test(text) ||
    /\bdevo\s+pagarl[oa]\b/i.test(text)
  ){
    missing.push("Effettuare il pagamento.");
  }

  /*
    ACQUISTO
  */

  if(
    /\bdevo\s+ancora\s+comprare\b/i.test(text) ||
    /\bdevo\s+comprarl[oa]\b/i.test(text) ||
    /\bnon\s+ho\s+ancora\s+comprat[oa]\b/i.test(text) ||
    /\bnon\s+l'ho\s+ancora\s+comprat[oa]\b/i.test(text)
  ){
    missing.push(
      object==="biglietto"
      ? "Acquistare il biglietto."
      : "Effettuare l'acquisto."
    );
  }

  /*
    INVIO
  */

  if(
    /\bdevo\s+ancora\s+inviare\b/i.test(text) ||
    /\bdevo\s+inviarl[oa]\b/i.test(text) ||
    /\bnon\s+ho\s+ancora\s+inviat[oa]\b/i.test(text) ||
    /\bnon\s+l'ho\s+ancora\s+inviat[oa]\b/i.test(text)
  ){
    missing.push("Inviare il documento.");
  }

  /*
    CONSEGNA
  */

  if(
    /\bdevo\s+ancora\s+consegnare\b/i.test(text) ||
    /\bdevo\s+consegnarl[oa]\b/i.test(text) ||
    /\bdevo\s+presentare\b/i.test(text) ||
    /\bdevo\s+presentarl[oa]\b/i.test(text)
  ){
    missing.push("Consegnare quanto richiesto.");
  }

  /*
    ANDARE / RECarsi
  */

  if(
    /\bdevo\s+andare\b/i.test(text) ||
    /\bdevo\s+recarmi\b/i.test(text)
  ){
    missing.push("Recarsi nel luogo indicato.");
  }

  return unique(missing);
}


/* =========================================================
   AZIONI ESPLICITE
========================================================= */

function extractTasks(text){

  const tasks=[];

  if(/\bdevo\s+consegnare\b/i.test(text)){
    tasks.push("Consegnare quanto richiesto.");
  }

  if(/\bdevo\s+presentare\b/i.test(text)){
    tasks.push("Presentare quanto richiesto.");
  }

  if(/\bdevo\s+andare\b/i.test(text)){
    tasks.push("Recarsi nel luogo indicato.");
  }

  if(/\bdevo\s+recarmi\b/i.test(text)){
    tasks.push("Recarsi nel luogo indicato.");
  }

  if(/\bdevo\s+portare\b/i.test(text)){
    tasks.push("Portare quanto necessario.");
  }

  if(/\bdevo\s+comprare\b/i.test(text)){
    tasks.push("Effettuare l'acquisto.");
  }

  if(/\bdevo\s+pagare\b/i.test(text)){
    tasks.push("Effettuare il pagamento.");
  }

  if(/\bdevo\s+inviare\b/i.test(text)){
    tasks.push("Inviare quanto richiesto.");
  }

  return unique(tasks);
}


/* =========================================================
   COSA PORTARE / RICORDARE
========================================================= */

function extractRemember(text,object){

  const remember=[];

  if(
    /\bportare\s+con\s+me\b/i.test(text) ||
    /\bportarlo\s+con\s+me\b/i.test(text) ||
    /\bportarla\s+con\s+me\b/i.test(text) ||
    /\bportarlo\b/i.test(text) ||
    /\bportarla\b/i.test(text)
  ){

    if(object==="modulo"){
      remember.push("Portare il modulo.");
    }
    else if(object==="documento"){
      remember.push("Portare il documento.");
    }
    else if(object==="biglietto"){
      remember.push("Portare il biglietto.");
    }
    else{
      remember.push("Portare quanto necessario.");
    }
  }

  const rememberMatch =
    text.match(/\bricordarmi\s+(?:di\s+)?([^,.]+)/i);

  if(rememberMatch){
    remember.push(
      "Ricordare: "+rememberMatch[1].trim()+"."
    );
  }

  return unique(remember);
}


/* =========================================================
   PRIORITÀ
========================================================= */

function detectPriority(text,dates,missing){

  if(
    /\burgente\b|\bsubito\b|\bscadenza\b|\bentro oggi\b|\bentro domani\b/i.test(text)
  ){
    return "ALTA";
  }

  if(missing.length && dates.length){
    return "ALTA";
  }

  if(
    /\bdevo\b|\bnecessario\b|\bimportante\b|\bappuntamento\b/i.test(text)
  ){
    return "MEDIA";
  }

  return "NORMALE";
}


/* =========================================================
   PRIMA AZIONE
========================================================= */

function buildFirstAction(missing,object){

  if(!missing.length){
    return "Definisci la prima azione concreta.";
  }

  const first=missing[0];

  if(/Firmare il modulo/i.test(first)){
    return "Firma il modulo.";
  }

  if(/Firmare il documento/i.test(first)){
    return "Firma il documento.";
  }

  if(/Effettuare il pagamento/i.test(first)){
    return "Effettua il pagamento.";
  }

  if(/Acquistare il biglietto/i.test(first)){
    return "Acquista il biglietto.";
  }

  if(/Effettuare l'acquisto/i.test(first)){
    return "Effettua l'acquisto.";
  }

  if(/Inviare/i.test(first)){
    return "Invia il documento.";
  }

  if(/Consegnare/i.test(first)){
    return "Prepara la consegna.";
  }

  return first;
}


/* =========================================================
   SEQUENZA LOGICA
========================================================= */

function buildSequence(missing,tasks,remember){

  const sequence=[];

  /*
    1. Azioni bloccanti
  */

  missing.forEach(item=>{
    if(!sequence.includes(item)){
      sequence.push(item);
    }
  });

  /*
    2. Azioni esplicite
  */

  tasks.forEach(item=>{
    if(!sequence.includes(item)){
      sequence.push(item);
    }
  });

  /*
    3. Cose da portare
  */

  remember.forEach(item=>{
    if(!sequence.includes(item)){
      sequence.push(item);
    }
  });

  return sequence.length
    ? sequence
    : ["Definire la prima azione concreta."];
}


/* =========================================================
   AVVISI
========================================================= */

function buildWarnings(text,dates){

  const warnings=[];

  if(!dates.length){
    warnings.push(
      "Non è stata rilevata una data o una scadenza."
    );
  }

  return warnings;
}


/* =========================================================
   ANALISI PRINCIPALE
========================================================= */

function analyze(){

  const raw=document.getElementById("input").value;
  const text=normalize(raw);

  if(!text){
    document.getElementById("output").innerHTML=`
      <div class="card">
        <p class="empty">Scrivi prima cosa devi fare.</p>
      </div>
    `;
    return;
  }

  const object=detectObject(text);

  const category=detectCategory(text);

  const dates=extractDateTime(text);

  const money=extractMoney(text);

  const places=extractPlace(text);

  const done=extractDone(text);

  const missing=extractMissing(text,object);

  const tasks=extractTasks(text);

  const remember=extractRemember(text,object);

  const priority=
    detectPriority(text,dates,missing);

  const firstAction=
    buildFirstAction(missing,object);

  const sequence=
    buildSequence(
      missing,
      tasks,
      remember
    );

  const warnings=
    buildWarnings(text,dates);

  let html="";


  /* ANALISI */

  html+=`
    <div class="card">
      <h2>Analisi</h2>
      <span class="tag">${esc(category)}</span>
      <span class="tag">Priorità: ${esc(priority)}</span>
    </div>
  `;


  /* PRIMA AZIONE */

  html+=`
    <div class="card">
      <h2>FAI QUESTO ADESSO</h2>
      <div class="big-action">
        ${esc(firstAction)}
      </div>
    </div>
  `;


  /* SEQUENZA */

  html+=`
    <div class="card">
      <h2>Sequenza</h2>
      <ol>
        ${sequence
          .map(x=>`<li>${esc(x)}</li>`)
          .join("")}
      </ol>
    </div>
  `;


  /* COSA HO CAPITO */

  html+=`
    <div class="card">

      <h2>Cosa ho capito</h2>

      <p>
        <strong>Cosa devi fare:</strong><br>
        ${
          tasks.length
          ? tasks.map(esc).join("<br>")
          : "<span class='empty'>Nessuna azione generica rilevata.</span>"
        }
      </p>

      <p>
        <strong>Cosa manca:</strong><br>
        ${
          missing.length
          ? missing.map(esc).join("<br>")
          : "<span class='empty'>Nessuna azione mancante rilevata.</span>"
        }
      </p>

      <p>
        <strong>Cosa è già fatto:</strong><br>
        ${
          done.length
          ? done.map(esc).join("<br>")
          : "<span class='empty'>Nessuna azione già completata rilevata.</span>"
        }
      </p>

      <p>
        <strong>Luogo:</strong><br>
        ${
          places.length
          ? places.map(esc).join(", ")
          : "<span class='empty'>Non rilevato.</span>"
        }
      </p>

      <p>
        <strong>Data / Ora:</strong><br>
        ${
          dates.length
          ? dates.map(esc).join(", ")
          : "<span class='empty'>Non rilevata.</span>"
        }
      </p>

      <p>
        <strong>Da portare / Ricordare:</strong><br>
        ${
          remember.length
          ? remember.map(esc).join("<br>")
          : "<span class='empty'>Niente di specifico rilevato.</span>"
        }
      </p>

    </div>
  `;


  /* IMPORTI */

  if(money.length){

    html+=`
      <div class="card">
        <h2>Importi</h2>
        ${money
          .map(x=>`<span class="tag">${esc(x)}</span>`)
          .join("")}
      </div>
    `;
  }


  /* AVVISI */

  if(warnings.length){

    html+=`
      <div class="card">
        <h2>Cosa controllare</h2>
        <ul>
          ${warnings
            .map(x=>`<li>${esc(x)}</li>`)
            .join("")}
        </ul>
      </div>
    `;
  }


  document.getElementById("output").innerHTML=html;
}


/* =========================================================
   CANCELLA
========================================================= */

function clearAll(){

  document.getElementById("input").value="";
  document.getElementById("output").innerHTML="";
}

</script>

</body>
</html>
