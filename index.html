<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DA FARE</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      background: #f5f5f7;
      margin: 0;
      padding: 24px;
      color: #111;
    }

    .app {
      max-width: 600px;
      margin: auto;
    }

    h1 {
      font-size: 38px;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #666;
      margin-bottom: 28px;
    }

    textarea {
      width: 100%;
      min-height: 180px;
      box-sizing: border-box;
      border: 1px solid #ddd;
      border-radius: 16px;
      padding: 16px;
      font-size: 17px;
      resize: vertical;
      background: white;
    }

    button {
      width: 100%;
      margin-top: 14px;
      padding: 16px;
      border: 0;
      border-radius: 14px;
      background: #111;
      color: white;
      font-size: 17px;
      font-weight: 600;
    }

    #result {
      margin-top: 24px;
      background: white;
      border-radius: 16px;
      padding: 20px;
      display: none;
    }

    .step {
      padding: 14px 0;
      border-bottom: 1px solid #eee;
    }
  </style>
</head>

<body>
  <div class="app">
    <h1>DA FARE</h1>

    <div class="subtitle">
      Trasforma un problema confuso in azioni chiare.
    </div>

    <textarea id="input"
      placeholder="Scrivi qui qualsiasi cosa devi gestire..."></textarea>

    <button onclick="organize()">
      Trasforma in azioni
    </button>

    <div id="result"></div>
  </div>

  <script>
    function organize() {
      const text = document.getElementById("input").value.trim();
      const result = document.getElementById("result");

      if (!text) {
        result.style.display = "block";
        result.innerHTML = "Scrivi prima cosa devi gestire.";
        return;
      }

      result.style.display = "block";

      result.innerHTML = `
        <h2>Il tuo piano</h2>

        <div class="step">
          <strong>1. Capisci il problema</strong><br>
          Rileggi ciò che hai scritto e individua cosa deve essere risolto.
        </div>

        <div class="step">
          <strong>2. Individua la prima azione</strong><br>
          Scegli la cosa più piccola che puoi fare subito.
        </div>

        <div class="step">
          <strong>3. Raccogli ciò che serve</strong><br>
          Prepara documenti, informazioni o strumenti necessari.
        </div>

        <div class="step">
          <strong>4. Esegui</strong><br>
          Completa la prima azione prima di passare alla successiva.
        </div>

        <div class="step">
          <strong>5. Controlla</strong><br>
          Verifica se il problema è realmente risolto.
        </div>
      `;
    }
  </script>
</body>
</html>
