<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DA FARE</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:#f5f5f7;
  color:#111;
}

.container{
  max-width:900px;
  margin:0 auto;
  padding:32px 18px 60px;
}

header{
  margin-bottom:24px;
}

h1{
  margin:0;
  font-size:42px;
  letter-spacing:-1.5px;
}

.subtitle{
  margin-top:5px;
  color:#666;
  font-size:17px;
}

textarea{
  width:100%;
  min-height:190px;
  resize:vertical;
  border:1px solid #ddd;
  border-radius:16px;
  padding:18px;
  font-size:17px;
  line-height:1.5;
  outline:none;
  background:white;
}

textarea:focus{
  border-color:#111;
}

.buttons{
  display:flex;
  gap:10px;
  margin:12px 0 24px;
}

button{
  border:0;
  border-radius:12px;
  padding:13px 20px;
  font-size:16px;
  cursor:pointer;
}

.primary{
  background:#111;
  color:white;
}

.secondary{
  background:#e8e8ed;
  color:#111;
}

.hidden{
  display:none;
}

.card{
  background:white;
  border-radius:18px;
  padding:20px;
  margin-top:14px;
  box-shadow:0 2px 12px rgba(0,0,0,.05);
}

.card h2{
  margin:0 0 15px;
  font-size:20px;
}

.priority{
  display:inline-block;
  padding:5px 10px;
  border-radius:999px;
  font-size:13px;
  font-weight:700;
  margin-left:7px;
  background:#eee;
}

.priority.high{
  background:#ffdede;
}

.priority.medium{
  background:#fff0c9;
}

.priority.low{
  background:#def5df;
}

.big-action{
  font-size:24px;
  font-weight:700;
  line-height:1.3;
}

ol,ul{
  margin:0;
  padding-left:24px;
}

li{
  margin:8px 0;
  line-height:1.4;
}

.fact{
  padding:10px 0;
  border-bottom:1px solid #eee;
}

.fact:last-child{
  border-bottom:0;
}

.label{
  font-weight:700;
}

.empty{
  color:#888;
}

.money{
  font-size:20px;
  font-weight:700;
}

.warning{
  color:#8a5a00;
}

@media(max-width:600px){
  h1{font-size:34px}
  .container{padding-top:22px}
  .buttons{flex-direction:column}
  button{width:100%}
}
</style>
</head>

<body>

<div class="container">

<header>
  <h1>DA FARE</h1>
  <div class="subtitle">Dal caos all’azione.</div>
</header>

<textarea id="input"
placeholder="Scrivi qui tutto quello che devi fare, anche in modo disordinato..."></textarea>

<div class="buttons">
  <button class="primary" onclick="analyze()">Analizza</button>
  <button class="secondary" onclick="clearAll()">Cancella</button>
</div>

<div id="output" class="hidden">

  <div class="card">
    <h2>Analisi</h2>
    <div id="analysis"></div>
  </div>

  <div class="card">
    <h2>FAI QUESTO ADESSO</h2>
    <div id="firstAction" class="big-action"></div>
  </div>

  <div class="card">
    <h2>Sequenza</h2>
    <ol id="sequence"></ol>
  </div>

  <div class="card">
    <h2>Cosa ho capito</h2>

    <div class="fact">
      <span class="label">Cosa devi fare:</span>
      <div id="tasks"></div>
    </div>

    <div class="fact">
      <span class="label">Cosa manca:</span>
      <div id="missing"></div>
    </div>

    <div class="fact">
      <span class="label">Cosa è già fatto:</span>
      <div id="done"></div>
    </div>

    <div class="fact">
      <span class="label">Luogo:</span>
      <div id="place"></div>
    </div>

    <div class="fact">
      <span class="label">Data / Ora:</span>
      <div id="dateTime"></div>
    </div>

    <div class="fact">
      <span class="label">Da portare / Ricordare:</span>
      <div id="remember"></div>
    </div>
  </div>

  <div id="moneyCard" class="card hidden">
    <h2>Importi</h2>
    <div id="money" class="money"></div>
  </div>

  <div id="warningCard" class="card hidden">
    <h2>Cosa controllare</h2>
    <ul id="warnings"></ul>
  </div>

</div>

</div>

<script>

/* =========================
   UTILITÀ
========================= */

function normalize(text){
  return text
    .toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g,"")
    .replace(/[’']/g,"'")
    .replace(/\s+/g," ")
    .trim();
}

function unique(arr){
  return [...new Set(arr.filter(Boolean))];
}

function has(text, patterns){
  return patterns.some(p => text.includes(p));
}

function esc(text){
  return String(text)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;");
}

/* =========================
   OGGETTO
========================= */

function detectObject(text){

  if(has(text,[
    "biglietto",
    "ticket",
    "treno",
    "aereo",
    "volo",
    "autobus",
    "bus"
  ])){
    return "biglietto";
  }

  if(has(text,[
    "modulo",
    "documento",
    "pratica",
    "certificato",
    "domanda",
    "istanza",
    "contratto"
  ])){
    return "modulo";
  }

  if(has(text,[
    "bolletta",
    "pagamento",
    "fattura",
    "rata",
    "bonifico"
  ])){
    return "pagamento";
  }

  if(has(text,[
    "appuntamento",
    "visita",
    "dentista",
    "medico",
    "colloquio",
    "riunione"
  ])){
    return "appuntamento";
  }

  if(has(text,[
    "comprare",
    "acquistare",
    "ordine",
    "acquisto"
  ])){
    return "acquisto";
  }

  return null;
}

/* =========================
   CATEGORIA
========================= */

function detectCategory(text, object){

  if(object==="biglietto")
    return "Viaggio / acquisto";

  if(object==="modulo")
    return "Documento / pratica";

  if(object==="pagamento")
    return "Bolletta / pagamento";

  if(object==="appuntamento")
    return "Appuntamento";

  if(object==="acquisto")
    return "Acquisto";

  if(has(text,["dentista","medico","visita"]))
    return "Appuntamento";

  if(has(text,["devo comprare","devo acquistare"]))
    return "Acquisto";

  return "Attività";
}

/* =========================
   DATE E ORARI
========================= */

function extractDateTime(raw){

  const text=normalize(raw);
  let parts=[];

  const days=[
    "lunedi","martedi","mercoledi",
    "giovedi","venerdi","sabato","domenica"
  ];

  const dayMap={
    lunedi:"lunedì",
    martedi:"martedì",
    mercoledi:"mercoledì",
    giovedi:"giovedì",
    venerdi:"venerdì",
    sabato:"sabato",
    domenica:"domenica"
  };

  for(const day of days){
    if(text.includes(day)){
      parts.push(dayMap[day]);
      break;
    }
  }

  if(text.includes("dopodomani"))
    parts.push("dopodomani");
  else if(text.includes("domani"))
    parts.push("domani");
  else if(text.includes("oggi"))
    parts.push("oggi");

  const dateMatch=text.match(
    /\b(?:entro\s+)?(\d{1,2})[\/\-](\d{1,2})(?:[\/\-](\d{2,4}))?\b/
  );

  if(dateMatch){
    let d=dateMatch[1];
    let m=dateMatch[2];
    let y=dateMatch[3];

    parts.push(
      "entro il "+d+"/"+m+(y ? "/"+y : "")
    );
  }

  const months={
    gennaio:"gennaio",
    febbraio:"febbraio",
    marzo:"marzo",
    aprile:"aprile",
    maggio:"maggio",
    giugno:"giugno",
    luglio:"luglio",
    agosto:"agosto",
    settembre:"settembre",
    ottobre:"ottobre",
    novembre:"novembre",
    dicembre:"dicembre"
  };

  for(const m in months){

    const regex=new RegExp(
      "\\b(\\d{1,2})\\s+"+m+"\\b"
    );

    const match=text.match(regex);

    if(match){
      parts.push(match[1]+" "+months[m]);
      break;
    }
  }

  const timeMatch=text.match(
    /\b(?:alle|ore)\s*(\d{1,2})(?::|\.| e )?(\d{2})?\b/
  );

  if(timeMatch){

    const hour=timeMatch[1];
    const minute=timeMatch[2];

    const time=minute
      ? hour.padStart(2,"0")+":"+minute
      : hour.padStart(2,"0")+":00";

    parts.push("ore "+time);
  }

  const momentWords=[
    "mattina",
    "pomeriggio",
    "sera",
    "notte"
  ];

  for(const moment of momentWords){
    if(text.includes(moment)){
      parts.push(moment);
      break;
    }
  }

  if(text.includes("entro oggi"))
    parts.push("entro oggi");

  if(text.includes("entro domani"))
    parts.push("entro domani");

  if(text.includes("entro venerdi"))
    parts.push("entro venerdì");

  /* elimina duplicati semantici */

  if(parts.includes("domani") &&
     parts.includes("entro domani")){
    parts=parts.filter(x=>x!=="domani");
  }

  if(parts.includes("oggi") &&
     parts.includes("entro oggi")){
    parts=parts.filter(x=>x!=="oggi");
  }

  return unique(parts).join(" — ");
}

/* =========================
   IMPORTI
========================= */

function extractMoney(raw){

  const matches=raw.match(
    /(?:€\s*)?\d+(?:[.,]\d{1,2})?\s*(?:€|euro)/gi
  ) || [];

  return unique(matches.map(x=>x.trim()));
}

/* =========================
   LUOGO
========================= */

function extractPlace(raw){

  const text=normalize(raw);

  const places=[
    "comune",
    "posta",
    "questura",
    "prefettura",
    "ospedale",
    "stazione",
    "aeroporto",
    "tribunale",
    "banca",
    "farmacia",
    "scuola",
    "universita",
    "roma",
    "milano",
    "napoli",
    "torino",
    "bologna",
    "firenze",
    "venezia",
    "genova",
    "palermo",
    "bari"
  ];

  for(const p of places){

    if(text.includes(p)){
      return p.charAt(0).toUpperCase()+p.slice(1);
    }
  }

  const presso=raw.match(
    /\bpresso\s+([^.,]+)/i
  );

  if(presso)
    return presso[1].trim();

  return null;
}

/* =========================
   AZIONI COMPLETATE
========================= */

function extractDone(raw){

  const text=normalize(raw);
  const result=[];

  if(has(text,[
    "modulo e gia compilato",
    "modulo gia compilato",
    "documento e gia compilato",
    "documento gia compilato",
    "pratica e gia compilata",
    "pratica gia compilata"
  ])){
    result.push("Il modulo/documento è già compilato.");
  }

  if(has(text,[
    "ho gia pagato",
    "pagamento gia effettuato",
    "pagamento gia fatto",
    "ho effettuato il pagamento"
  ])){
    result.push("Il pagamento è già stato effettuato.");
  }

  if(has(text,[
    "ho gia comprato",
    "gia comprato",
    "acquisto gia effettuato",
    "ho gia acquistato"
  ])){
    result.push("L'acquisto è già stato effettuato.");
  }

  if(has(text,[
    "ho gia inviato",
    "gia inviato",
    "gia mandato",
    "gia spedito"
  ])){
    result.push("L'invio è già stato effettuato.");
  }

  return unique(result);
}

/* =========================
   AZIONI MANCANTI
========================= */

function extractMissing(raw, object){

  const text=normalize(raw);
  const result=[];

  if(has(text,[
    "devo ancora firmare",
    "devo firmarlo",
    "devo ancora firmarlo",
    "manca la firma",
    "devo firmare"
  ])){
    result.push(
      object==="modulo"
      ? "Firmare il modulo."
      : "Firmare il documento."
    );
  }

  if(has(text,[
    "non ho ancora effettuato il pagamento",
    "non ho ancora pagato",
    "devo ancora pagare",
    "devo pagare",
    "manca il pagamento"
  ])){
    result.push("Effettuare il pagamento.");
  }

  if(has(text,[
    "non l'ho ancora comprato",
    "non ho ancora comprato",
    "devo ancora comprare",
    "devo ancora acquistare"
  ])){
    if(object==="biglietto")
      result.push("Acquistare il biglietto.");
    else
      result.push("Effettuare l'acquisto.");
  }

  if(has(text,[
    "devo ancora inviare",
    "non ho ancora inviato",
    "devo inviare"
  ])){
    result.push("Effettuare l'invio.");
  }

  if(has(text,[
    "devo ancora consegnare",
    "non ho ancora consegnato"
  ])){
    result.push("Consegnare quanto richiesto.");
  }

  return unique(result);
}

/* =========================
   AZIONI DA FARE
========================= */

function extractTasks(raw, object){

  const text=normalize(raw);
  const result=[];

  if(has(text,[
    "devo consegnare",
    "devo presentare"
  ])){
    result.push("Consegnare quanto richiesto.");
  }

  if(has(text,[
    "devo andare",
    "devo recarmi",
    "devo andare al",
    "devo recarmi al"
  ])){
    result.push("Recarsi sul posto.");
  }

  if(has(text,[
    "devo portare",
    "devo avere con me"
  ])){
    result.push("Portare quanto necessario.");
  }

  if(has(text,[
    "devo pagare"
  ]) && !has(text,[
    "non ho ancora effettuato il pagamento",
    "non ho ancora pagato"
  ])){
    result.push("Effettuare il pagamento.");
  }

  if(has(text,[
    "devo comprare"
  ]) && object!=="biglietto"){
    result.push("Effettuare l'acquisto.");
  }

  if(has(text,[
    "devo acquistare"
  ]) && object!=="biglietto"){
    result.push("Effettuare l'acquisto.");
  }

  if(object==="biglietto" &&
     has(text,[
       "devo comprare",
       "devo acquistare"
     ])){
    result.push("Acquistare il biglietto.");
  }

  if(has(text,[
    "devo inviare",
    "devo mandare",
    "devo spedire"
  ])){
    result.push("Effettuare l'invio.");
  }

  if(has(text,[
    "arrivare ",
    "arriva ",
    "arrivare 10 minuti",
    "arrivare 15 minuti"
  ])){
    const match=raw.match(
      /\barrivare\s+(\d+)\s+minuti\s+prima\b/i
    );

    if(match){
      result.push(
        "Arrivare "+match[1]+" minuti prima."
      );
    }
  }

  return unique(result);
}

/* =========================
   COSA PORTARE
========================= */

function extractRemember(raw, object){

  const text=normalize(raw);
  const result=[];

  const patterns=[
    /portare\s+(?:con me\s+)?(?:la|il|lo|i|gli|le|un|una)\s+([^.,]+)/i,
    /devo portare\s+(?:la|il|lo|i|gli|le|un|una)\s+([^.,]+)/i
  ];

  for(const regex of patterns){

    const match=raw.match(regex);

    if(match){
      let item=match[1]
        .trim()
        .replace(/\s+e arrivare.*$/i,"")
        .replace(/\s+e arrivare.*$/i,"");

      if(item){
        result.push(
          "Portare "+item+"."
        );
      }

      break;
    }
  }

  if(has(text,[
    "portarlo con me"
  ])){

    if(object==="modulo"){
      result.push("Portare il modulo.");
    }
  }

  if(has(text,[
    "portarla con me"
  ])){

    if(object==="modulo"){
      result.push("Portare il modulo.");
    }
  }

  return unique(result);
}

/* =========================
   PRIORITÀ
========================= */

function detectPriority(raw, dateTime, missing, category){

  const text=normalize(raw);

  if(
    missing.length>0 ||
    has(text,[
      "urgente",
      "urgentissimo",
      "entro oggi",
      "entro domani",
      "scade oggi",
      "scade domani",
      "prima possibile",
      "immediatamente"
    ])
  ){
    return "ALTA";
  }

  if(
    dateTime ||
    category==="Appuntamento" ||
    has(text,[
      "devo",
      "importante",
      "appuntamento"
    ])
  ){
    return "MEDIA";
  }

  return "BASSA";
}

/* =========================
   PRIMA AZIONE
========================= */

function buildFirstAction(
  missing,
  tasks,
  remember,
  dateTime,
  object
){

  if(missing.length)
    return missing[0];

  if(tasks.length)
    return tasks[0];

  if(remember.length)
    return remember[0];

  if(object==="appuntamento" && dateTime)
    return "Preparare ciò che serve per l'appuntamento.";

  if(dateTime)
    return "Organizzare l'attività prevista.";

  return "Definisci la prima azione concreta.";
}

/* =========================
   SEQUENZA
========================= */

function buildSequence(
  missing,
  tasks,
  remember,
  dateTime,
  object
){

  let result=[];

  result=[
    ...missing,
    ...tasks,
    ...remember
  ];

  /*
    Evita duplicazioni concettuali.
  */

  const normalized=[];

  for(const item of result){

    const n=normalize(item);

    const duplicate=normalized.some(existing=>{

      const e=normalize(existing);

      if(
        (n.includes("acquistare il biglietto") &&
         e.includes("effettuare l'acquisto")) ||
        (e.includes("acquistare il biglietto") &&
         n.includes("effettuare l'acquisto"))
      ){
        return true;
      }

      if(
        n.includes("effettuare il pagamento") &&
        e.includes("effettuare il pagamento")
      ){
        return true;
      }

      if(
        n.includes("portare il modulo") &&
        e.includes("portare il modulo")
      ){
        return true;
      }

      return n===e;
    });

    if(!duplicate)
      normalized.push(item);
  }

  result=normalized;

  if(
    object==="appuntamento" &&
    !result.length &&
    dateTime
  ){
    result.push(
      "Preparare ciò che serve per l'appuntamento."
    );
  }

  return result;
}

/* =========================
   AVVISI
========================= */

function buildWarnings(
  dateTime,
  place,
  tasks,
  missing,
  category,
  raw
){

  const warnings=[];

  if(!dateTime){
    warnings.push(
      "Non è stata rilevata una data o una scadenza."
    );
  }

  if(
    category==="Appuntamento" &&
    !place &&
    !has(normalize(raw),[
      "dentista",
      "medico",
      "visita",
      "appuntamento"
    ])
  ){
    warnings.push(
      "Non è stato rilevato il luogo dell'appuntamento."
    );
  }

  if(!tasks.length && !missing.length && !dateTime){
    warnings.push(
      "Non sono state rilevate azioni concrete."
    );
  }

  return unique(warnings);
}

/* =========================
   ANALISI PRINCIPALE
========================= */

function analyze(){

  const raw=document.getElementById("input").value.trim();

  if(!raw){
    return;
  }

  const object=detectObject(normalize(raw));
  const category=detectCategory(
    normalize(raw),
    object
  );

  const dateTime=extractDateTime(raw);
  const money=extractMoney(raw);
  const place=extractPlace(raw);
  const done=extractDone(raw);
  const missing=extractMissing(raw,object);
  const tasks=extractTasks(raw,object);
  const remember=extractRemember(raw,object);

  const priority=detectPriority(
    raw,
    dateTime,
    missing,
    category
  );

  const firstAction=buildFirstAction(
    missing,
    tasks,
    remember,
    dateTime,
    object
  );

  const sequence=buildSequence(
    missing,
    tasks,
    remember,
    dateTime,
    object
  );

  const warnings=buildWarnings(
    dateTime,
    place,
    tasks,
    missing,
    category,
    raw
  );

  render({
    category,
    priority,
    firstAction,
    sequence,
    tasks,
    missing,
    done,
    place,
    dateTime,
    remember,
    money,
    warnings
  });
}

/* =========================
   RENDER
========================= */

function render(data){

  document.getElementById("output")
    .classList.remove("hidden");

  document.getElementById("analysis").innerHTML=
    "<strong>"+esc(data.category)+"</strong>"+
    '<span class="priority '+(
      data.priority==="ALTA"
      ? "high"
      : data.priority==="MEDIA"
      ? "medium"
      : "low"
    )+'">'+esc(data.priority)+"</span>";

  document.getElementById("firstAction").textContent=
    data.firstAction;

  const sequence=document.getElementById("sequence");
  sequence.innerHTML="";

  if(data.sequence.length){

    data.sequence.forEach(item=>{
      const li=document.createElement("li");
      li.textContent=item;
      sequence.appendChild(li);
    });

  }else{

    sequence.innerHTML=
      '<li class="empty">Nessuna sequenza concreta rilevata.</li>';
  }

  renderList(
    "tasks",
    data.tasks,
    "Nessuna azione specifica rilevata."
  );

  renderList(
    "missing",
    data.missing,
    "Nessuna azione mancante rilevata."
  );

  renderList(
    "done",
    data.done,
    "Nessuna azione già completata rilevata."
  );

  renderSingle(
    "place",
    data.place || "Non rilevato."
  );

  renderSingle(
    "dateTime",
    data.dateTime || "Non rilevata."
  );

  renderList(
    "remember",
    data.remember,
    "Niente di specifico rilevato."
  );

  const moneyCard=
    document.getElementById("moneyCard");

  if(data.money.length){

    moneyCard.classList.remove("hidden");

    document.getElementById("money").textContent=
      data.money.join(" • ");

  }else{

    moneyCard.classList.add("hidden");
  }

  const warningCard=
    document.getElementById("warningCard");

  const warnings=
    document.getElementById("warnings");

  warnings.innerHTML="";

  if(data.warnings.length){

    warningCard.classList.remove("hidden");

    data.warnings.forEach(item=>{
      const li=document.createElement("li");
      li.textContent=item;
      warnings.appendChild(li);
    });

  }else{

    warningCard.classList.add("hidden");
  }

  window.scrollTo({
    top:document.getElementById("output").offsetTop-15,
    behavior:"smooth"
  });
}

/* =========================
   RENDER HELPERS
========================= */

function renderList(id,items,emptyText){

  const el=document.getElementById(id);

  if(!items.length){
    el.innerHTML=
      '<span class="empty">'+
      esc(emptyText)+
      "</span>";
    return;
  }

  el.innerHTML=
    "<ul>"+
    items.map(item=>
      "<li>"+esc(item)+"</li>"
    ).join("")+
    "</ul>";
}

function renderSingle(id,value){

  document.getElementById(id).innerHTML=
    esc(value);
}

/* =========================
   CANCELLA
========================= */

function clearAll(){

  document.getElementById("input").value="";

  document.getElementById("output")
    .classList.add("hidden");

  document.getElementById("input").focus();
}

</script>
